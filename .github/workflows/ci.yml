name: API CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutrition_log
          POSTGRES_USER: workout_user
          POSTGRES_PASSWORD: ci-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py test
        env:
          SECRET_KEY: ci-only-secret
          DEBUG: "False"
          DATABASE_URL: postgres://workout_user:ci-db-password@localhost:5432/nutrition_log