[project]
name = "workout-log-api"
version = "0.1.0"
description = "Workout tracking REST API - Django & DRF project"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2,<6.0",
    "dj-database-url>=2.1",
    "djangorestframework>=3.15",
    "django-filter>=24.0",
    "python-decouple>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "coverage>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "workout"]